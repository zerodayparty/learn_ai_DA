[project]
name = "learn-ai-da"
version = "0.1.0"
description = "Reproducible H&M customer analysis with NumPy, Pandas, and RFM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "seaborn>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "nbformat>=5,<6",
]
