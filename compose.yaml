services: # 함께 관리할 실행 프로그램 목록이다.
    analysis: # 분석용 컨테이너 이름을 정한다.
        build: . # 마지막에 작성한 Dockerfile로 이미지를 만든다.
        image: hm-analysis:local # 이 컴퓨터에서만 사용할 이미지 이름이다.
        volumes: # 데이터는 이미지에 굽지 않고 실행할 때 연결한다.
            - ./data/sample:/app/data/sample:ro # 거래·상품 표본은 읽기 전용으로 연결한다.
            - ./data/raw/images:/app/data/raw/images:ro # 실제 이미지는 읽기 전용으로 연결한다.
            - ./data/processed:/app/data/processed # 로컬 전처리 결과를 보존한다.
            - ./reports:/app/reports # 집계 설명과 그림을 로컬에 보존한다.
